name: islami_app_c15_sun_7pm
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/files/


  fonts:
    - family: Janna
      fonts:
        - asset: assets/fonts/Janna-LT-Bold.ttf
        - asset: assets/fonts/Janna-LT-Regular.ttf
